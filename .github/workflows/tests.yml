name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Lock files match requirements*.in
        # Recompiled in place, as CONTRIBUTING.md says: uv keeps the pins
        # already in the lock, so this fails only when a .in file and its
        # lock disagree — not whenever something upstream releases.
        run: |
          uv pip compile requirements.in --universal --python-version 3.11 --generate-hashes -q -o requirements.txt
          uv pip compile requirements-dev.in --universal --python-version 3.11 --generate-hashes -q -o requirements-dev.txt
          git diff --exit-code -I '^#' -- requirements.txt requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: JavaScript syntax
        run: |
          for f in app/static/js/*.js app/static/js/lib/*.js app/static/js/features/*.js; do
            node --check "$f"
          done
      - name: Migrations build the models' schema
        run: |
          export DATABASE_URL="sqlite:///$RUNNER_TEMP/migrations.db" SECRET_KEY=ci
          alembic upgrade head
          alembic check

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest --ignore=tests/e2e --cov --cov-report=term-missing:skip-covered

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - name: Browser tests
        run: pytest tests/e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t zonecast:ci .
      - name: A data folder the app can't write stops the start, saying how to fix it
        run: |
          # What Docker does with a bind-mount source that doesn't exist yet.
          mkdir -p "$RUNNER_TEMP/rootowned" && sudo chown root:root "$RUNNER_TEMP/rootowned"
          if docker run --name zc-unwritable -e SECRET_KEY=ci-only-secret -v "$RUNNER_TEMP/rootowned:/app/data" zonecast:ci; then
            echo "the app started with an unwritable data folder"; exit 1
          fi
          docker logs zc-unwritable > "$RUNNER_TEMP/unwritable.log" 2>&1 || true
          tail -5 "$RUNNER_TEMP/unwritable.log"
          grep -q "sudo chown -R 1000:1000 data media backups" "$RUNNER_TEMP/unwritable.log"
      - name: Install from the kit's files as the deploy guide says
        run: |
          mkdir -p "$RUNNER_TEMP/zonecast"
          git archive HEAD app migrations alembic.ini deploy requirements.txt Dockerfile docker-compose.yml .env.example README.md             | tar -x -C "$RUNNER_TEMP/zonecast"
          cd "$RUNNER_TEMP/zonecast"
          cp .env.example .env
          sed -i 's/^SECRET_KEY=.*/SECRET_KEY=ci-only-secret-key/; s/^DEFAULT_ADMIN_PASSWORD=.*/DEFAULT_ADMIN_PASSWORD=ci-admin-password/' .env
          mkdir -p data media backups && sudo chown -R 1000:1000 data media backups
          docker compose up -d --build
          for i in $(seq 60); do curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 1; done
          docker compose logs --no-color; exit 1
      - name: Runs as an unprivileged user, with the one capability it needs on date
        run: |
          cd "$RUNNER_TEMP/zonecast"
          test "$(docker compose exec -T zonecast id -u)" = 1000
          docker compose exec -T zonecast getcap /bin/date | grep -q cap_sys_time
      - name: Used like a user would (zone, speaker, audio upload, backup, clock)
        run: python3 tests/docker_smoke.py setup http://127.0.0.1:8000 ci-admin-password "$(timedatectl show -p NTPSynchronized --value)"
      - name: Everything survives a restart
        run: |
          (cd "$RUNNER_TEMP/zonecast" && docker compose restart)
          for i in $(seq 60); do curl -fsS http://127.0.0.1:8000/health > /dev/null && break; sleep 1; done
          python3 tests/docker_smoke.py after-restart http://127.0.0.1:8000 ci-admin-password
      - name: Container log
        if: always()
        run: (cd "$RUNNER_TEMP/zonecast" && docker compose logs --no-color | tail -150) || true
