<!DOCTYPE html>
<html lang="en" data-sun-lat="{{ sun_lat }}" data-sun-lon="{{ sun_lon }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }} — Login</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/logo-icon.svg">
    <link href="/static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css?v={{ asset_version }}" rel="stylesheet">
    <style>
        :root {
            --pa-accent: {{ theme.accent }};
            --pa-accent-hover: {{ theme.accent_hover }};
            --pa-accent-light: {{ theme.accent_light }};
            --pa-accent-rgb: {{ theme.accent_rgb }};
        }
    </style>
    <script src="/static/js/theme.js?v={{ asset_version }}"></script>
</head>
<body class="login-body">
    <main class="login-card">
        <div class="d-flex gap-2 mb-3">
            <select class="form-select form-select-sm" id="language-select" data-i18n-attr="aria-label" data-i18n="system.language" aria-label="Language">
                <option value="en">English</option>
                <option value="it">Italiano</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="es">Español</option>
                <option value="ja">日本語</option>
                <option value="zh">简体中文</option>
            </select>
            <select class="form-select form-select-sm login-theme-select" id="theme-select" aria-label="Theme">
                <option value="light" data-i18n="login.themeLight">Light</option>
                <option value="dark" data-i18n="login.themeDark">Dark</option>
                <option value="auto" data-i18n="login.themeAuto">Auto</option>
            </select>
        </div>
        <div class="login-logo">{% include "svg/logo-wide.svg" %}</div>
        <form id="login-form">
            <div class="mb-3">
                <label class="form-label" for="username" data-i18n="login.username">Username</label>
                <input type="text" class="form-control" id="username" autocomplete="username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password" data-i18n="topbar.password">Password</label>
                <input type="password" class="form-control" id="password" autocomplete="current-password" required>
            </div>
            <div class="alert alert-danger py-2 d-none" id="login-error" role="alert"></div>
            <button type="submit" class="btn btn-primary w-100" id="login-submit" data-i18n="login.signIn">Sign in</button>
        </form>
        <form id="twofa-form" class="d-none">
            <p class="small text-muted mb-3" data-i18n="login.twofaHelp">Enter the 6-digit code from your authenticator app, or a recovery code.</p>
            <div class="mb-3">
                <label class="form-label" for="twofa-code" data-i18n="login.code">Code</label>
                <input type="text" class="form-control" id="twofa-code" inputmode="numeric" autocomplete="one-time-code" required>
            </div>
            <div class="alert alert-danger py-2 d-none" id="twofa-error" role="alert"></div>
            <button type="submit" class="btn btn-primary w-100" data-i18n="login.verify">Verify</button>
            <button type="button" class="btn btn-link w-100 mt-1" id="twofa-back" data-i18n="login.back">Back</button>
        </form>
    </main>
    <script src="/static/js/i18n.js?v={{ asset_version }}"></script>
    <script type="module" src="/static/js/login.js?v={{ asset_version }}"></script>
</body>
</html>
