# Optional reverse proxy for ZoneCast with TLS — NOT applied
# automatically by install_ubuntu.sh (see the deployment guide,
# section "Sicurezza: HTTPS"). Puts nginx in front of the app on
# 443/tcp and forwards to uvicorn on 127.0.0.1:8000; the app itself
# keeps listening only on localhost once this is in place (see the
# commented ExecStart alternative in zonecast.service).
#
# Usage (after installing zonecast, nginx and certbot):
#   sudo cp deploy/nginx-zonecast.conf /etc/nginx/sites-available/zonecast
#   sudo sed -i 's/zonecast.example.local/YOUR_HOSTNAME_OR_IP/' /etc/nginx/sites-available/zonecast
#   sudo ln -s /etc/nginx/sites-available/zonecast /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   # with a real domain name pointed at this machine:
#   sudo certbot --nginx -d zonecast.example.local
#   # without a domain (LAN-only IP), use a self-signed cert instead —
#   # see the guide for the openssl command.

server {
    listen 80;
    server_name zonecast.example.local;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # File upload / long-poll friendliness for media uploads
        client_max_body_size 60m;
        proxy_read_timeout 120s;
    }
}
